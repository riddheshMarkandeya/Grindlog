<!doctype html>
<!-- The 1200x630 social card (Open Graph / Twitter), screenshotted to site/og.png by screens.spec.ts.
     Kept out of site/ so it isn't deployed. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grindlog social card</title>
<style>
@font-face{font-family:"Barlow Condensed";src:url(../../site/fonts/barlow-condensed-800-italic.woff2) format("woff2");font-weight:800;font-style:italic}
@font-face{font-family:"Barlow Condensed";src:url(../../site/fonts/barlow-condensed-700-normal.woff2) format("woff2");font-weight:700}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0c0c0d;color:#ededed;font-family:"Segoe UI",sans-serif}
.pitch{position:absolute;left:64px;top:96px;width:520px}
h1{font:italic 800 104px/0.95 "Barlow Condensed";margin:0}
h1 span{color:#c6f24e}
p{font-size:28px;line-height:1.35;color:#b0b0b5;margin:28px 0 0}
.tag{position:absolute;left:64px;bottom:56px;font:700 22px "Barlow Condensed";letter-spacing:.14em;text-transform:uppercase;color:#85858c}
.tag b{color:#c6f24e;font-weight:700}
.shot{position:absolute;left:620px;top:70px;width:900px;border:1px solid #2c2c30;border-radius:10px;overflow:hidden;box-shadow:0 30px 80px -30px rgb(198 242 78 / .25)}
.shot img{display:block;width:100%}
</style>
</head>
<body>
<div class="pitch"><h1>Know your <span>grind</span>.</h1><p>Free Rocket League stats tracker. Sessions, trends and stats with your friends.</p></div>
<div class="tag"><b>Grindlog</b> · Official Stats API · Windows</div>
<div class="shot"><img src="../../site/screens/recap.png" alt="A Grindlog session recap"></div>
</body>
</html>
