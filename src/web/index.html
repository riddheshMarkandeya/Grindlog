<!doctype html>
<html lang="en" data-theme="carbon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grindlog</title>
    <!-- The .ico alone: browsers prefer an SVG icon, and it would replace the .ico's sharper 16 px drawing. -->
    <link rel="icon" href="/favicon.ico" />
    <!-- The saved theme before the first paint (grindlog-theme, written by the app): no carbon flash. -->
    <script>
      try { var t = localStorage.getItem("grindlog-theme"); if (t === "slate" || t === "oled" || t === "carbon") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
